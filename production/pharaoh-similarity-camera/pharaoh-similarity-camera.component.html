<div
  class="camera-screen camera-screen--full-frame camera-screen-full"
  [class.camera-screen--has-background]="hasBackgroundAsset()"
  [class.camera-screen--processing]="state() === 'processing'"
  [class.camera-screen-full--has-background]="hasBackgroundAsset()"
  [class.camera-screen-full--processing]="state() === 'processing' || isGenerationLoading()"
  [style.background-image]="backgroundImageStyle()"
  [ngClass]="customClasses()?.screen"
>
  <div
    *ngIf="state() === 'error'"
    class="camera-screen__error"
    role="alert"
    aria-live="assertive"
    [ngClass]="customClasses()?.errorOverlay"
  >
    <div class="camera-screen__error-overlay">
      <div
        class="camera-screen__error-icon"
        aria-hidden="true"
      >
        <img
          [src]="resolvedErrorIconUrl()"
          [alt]="resolvedCopy().errorIconAlt"
        />
      </div>

      <div class="camera-screen__error-copy">
        <h2 class="camera-screen__error-title">{{ failureTitle() }}</h2>
      </div>

      <button
        type="button"
        class="camera-screen__error-button"
        (click)="handleFailureAction()"
      >
        {{ failureButtonText() }}
      </button>
    </div>
  </div>

  <div
    *ngIf="state() === 'loading'"
    class="camera-screen__loader"
    role="status"
    aria-live="polite"
  >
    <span class="camera-screen__spinner"></span>
  </div>

  <main class="camera-screen__content camera-screen-full__content">
    <section
      class="camera-screen__viewer camera-screen__viewer--full-frame camera-screen-full__viewer"
      [attr.aria-label]="resolvedCopy().cameraPreviewLabel"
      [ngClass]="customClasses()?.viewer"
    >
      <div class="camera-screen-full__frame-shell">
        <div class="camera-screen-full__media-stage">
          <video
            #videoEl
            autoplay
            muted
            playsinline
            class="camera-screen__video camera-screen__video--full-frame camera-screen-full__video"
            [class.camera-screen__video--flipped]="activeCameraFacingMode() === 'user'"
            [class.camera-screen-full__video--flipped]="activeCameraFacingMode() === 'user'"
            [class.d-none]="!!capturedImageUrl()"
          ></video>

          <img
            *ngIf="capturedImageUrl()"
            [src]="capturedImageUrl()!"
            [alt]="resolvedCopy().capturedImageAlt"
            class="camera-screen__captured-image camera-screen__captured-image--full-frame camera-screen-full__captured-image"
            [class.camera-screen__captured-image--result]="hasCompletedProcessingResultState()"
          />

          <canvas
            #fullFrameOverlayEl
            class="camera-screen__canvas--full-frame camera-screen-full__canvas"
            [class.camera-screen-full__canvas--black]="shouldShowBlackFullFrameCanvas()"
            aria-hidden="true"
          ></canvas>

          <div
            *ngIf="rectangleFrame() && (state() === 'processing' || isGenerationLoading())"
            class="camera-screen-full__processing-top"
            aria-hidden="true"
          ></div>
        </div>

        <img
          class="camera-screen__rectangle-frame camera-screen-full__rectangle-frame"
          [src]="resolvedAssets().rectangleFrameUrl"
          alt=""
          aria-hidden="true"
        />
      </div>

      <p
        *ngIf="shouldShowNoFaceState()"
        class="camera-screen__no-face-message camera-screen-full__no-face-message mb-0"
        aria-live="polite"
      >
        {{ noDetectedFaceText() }}
      </p>
    </section>

    <footer
      class="camera-screen__actions camera-screen-full__actions p-4"
      [class.camera-screen__actions--processing]="shouldDimActionsState()"
      [class.camera-screen-full__actions--processing]="shouldDimActionsState()"
      [ngClass]="customClasses()?.actions"
    >
      <button
        type="button"
        class="camera-screen__capture-button"
        [class.camera-screen__button--dimmed]="shouldDimActionsState()"
        [ngClass]="customClasses()?.captureButton"
        (click)="captureAndCompare()"
        [attr.aria-label]="resolvedCopy().captureImageLabel"
        [disabled]="shouldDimActionsState()"
      >
        <span class="camera-screen__capture-ring">
          <span class="camera-screen__capture-core">
            <svg
              *ngIf="showCaptureCameraIcon() || state() === 'error'"
              class="camera-screen__capture-icon icon-6"
              viewBox="0 0 32 32"
              focusable="false"
              aria-hidden="true"
            >
              <use href="#icon-camera"></use>
            </svg>
          </span>
        </span>
      </button>

      <label
        class="camera-screen__upload-button"
        [attr.aria-label]="resolvedCopy().uploadImageLabel"
        [class.camera-screen__button--dimmed]="shouldDimActionsState()"
        [attr.aria-disabled]="shouldDimActionsState()"
        [ngClass]="customClasses()?.uploadButton"
        (click)="onUploadClick()"
      >
        <input
          type="file"
          accept="image/*"
          class="camera-screen__upload-input"
          [attr.aria-label]="resolvedCopy().uploadImageLabel"
          [disabled]="shouldDimActionsState()"
          (change)="onImageFileSelected($event)"
        />

        <svg
          class="camera-screen__upload-icon icon-6"
          viewBox="0 0 32 32"
          focusable="false"
          aria-hidden="true"
        >
          <use href="#upload-image"></use>
        </svg>
      </label>
    </footer>

    <!-- <div
      *ngIf="shouldShowMatchedResultActionState()"
      class="camera-screen__result-action p-4"
    >
      <p class="camera-screen-full__matched-copy">{{ matchedResultText() }}</p>
      <button
        type="button"
        class="camera-screen__matched-button"
        [class.camera-screen__button--dimmed]="isMatchedActionDisabled()"
        [disabled]="isMatchedActionDisabled()"
        [attr.aria-disabled]="isMatchedActionDisabled()"
        (click)="onTurnIntoMatchedPharaoh()"
      >
        {{ matchedActionLabel() }}
      </button>
    </div> -->
  </main>
</div>
