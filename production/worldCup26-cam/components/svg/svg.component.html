<div>
  <svg
    [ngClass]="[svg() ? 'icon-' + svg() : '', size() ? 'icon-' + size() : 'icon-4', extraClasses()]"
    [class]="classList()"
    [attr.viewBox]="viewBox()"
    [attr.role]="role()"
    [attr.tabindex]="clickable() && !disabled() ? 0 : null"
    [attr.aria-label]="ariaLabel() || title() || null"
    [attr.aria-hidden]="ariaHidden()"
    [attr.focusable]="focusable()"
    [attr.fill]="fill()"
    [attr.stroke]="stroke()"
    [class.svg-icon-clickable]="clickable() && !disabled()"
    [class.svg-icon-disabled]="disabled()"
    (click)="onClick()"
  >
    @if (title()) {
      <title>{{ title() }}</title>
    }
    @if (svg()) {
      <use [attr.xlink:href]="'#icon-' + svg()"></use>
    }
  </svg>
</div>
